# Use root/example as user/password credentials

networks:
  test-network:
services:

  mongo:
    image: mongo
    networks: 
      - test-network
    restart: always
    env_file: .env
    volumes:
      - ${MONGO_HOST_DIR}:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - ${MONGO_HOST_PORT}:27017

